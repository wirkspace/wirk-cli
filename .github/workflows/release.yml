name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_tag:
        description: Existing public tag to verify without publication
        default: v0.4.1
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}-${{ inputs.verify_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name == 'push' }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: The tag names the package's version
        run: test "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - name: zsh, for the shell-safety tests
        run: command -v zsh || { sudo apt-get update -q && sudo apt-get install -y -q zsh; }
      - run: python -m pip install --timeout 20 --retries 2 build uv ".[test]"
      - run: python -m pytest tests -q -rs
      - run: python -m build
      - name: SHA-256 sums of what is released
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      kind: cli
  verify-public:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-release.yml
    with:
      kind: cli
      verify_tag: ${{ inputs.verify_tag }}
  pypi:
    # Keep release.yml / pypi as the configured trusted-publisher identity.
    needs: publish
    if: ${{ github.event_name == 'push' && vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Retain only missing distributions after verifying any existing PyPI bytes
        id: prepare
        run: python scripts/release_assets.py pypi-prepare --kind cli --tag "$GITHUB_REF_NAME" --dest pypi-dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: ${{ steps.prepare.outputs.pending == 'true' }}
        with:
          packages-dir: pypi-dist/
      - name: Verify the actual PyPI distributions
        run: python scripts/release_assets.py pypi-verify --kind cli --tag "$GITHUB_REF_NAME"
