name: Tests and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    # GitHub's free runners once the repository is public; the project's own runner while it is private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      WIRK_PRIVACY_HISTORY: ${{ github.event.repository.private && '0' || '1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # the privacy scan reads every reachable commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: zsh, for the shell-safety tests
        run: command -v zsh || { sudo apt-get update -q && sudo apt-get install -y -q zsh; }
      - run: python -m pip install build uv ".[test]"  # uv runs install.sh's real install test
      - run: python -m pytest tests -q -rs
      - run: python -m build
  install-macos:
    # install.sh on macOS's sh, once the repository is public and GitHub's macOS runners are free for it.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv ".[test]"
      - run: python -m pytest tests/test_install.py -q -rs
